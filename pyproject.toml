[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goaudit"
version = "0.2.3"
description = "Taxonomic quality control for Gene Ontology annotations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Andy Bachler"}]
keywords = ["bioinformatics", "gene ontology", "taxonomy", "annotation", "quality control"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/Andy-B-123/GOaudit"
Documentation = "https://github.com/Andy-B-123/GOaudit#readme"
Issues = "https://github.com/Andy-B-123/GOaudit/issues"
Source = "https://github.com/Andy-B-123/GOaudit"

[project.scripts]
goaudit = "goaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

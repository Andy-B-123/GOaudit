<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950" role="img" aria-labelledby="title desc">
<title id="title">GOaudit workflow</title>
<desc id="desc">GOaudit workflow</desc>
<rect width="1800" height="950" fill="#FFFFFF"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17212B}.title{font-size:31px;font-weight:700}.panel{font-size:27px;font-weight:700}.heading{font-size:22px;font-weight:700}.body{font-size:18px}.small{font-size:15px;fill:#52606D}.axis{font-size:16px;fill:#52606D}</style>
<text x="70.0" y="70.0" class="title" text-anchor="start">GOaudit adds a taxonomic checkpoint before interpretation</text>
